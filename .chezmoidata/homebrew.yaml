# Shared entries are installed on every macOS machine. Profile entries are
# selected by machineProfile in each machine's chezmoi config.
homebrew:
  taps:
    shared:
      - abue-ammar/tinycast
      - steipete/tap
    profiles:
      daily: []
      home-server: []
      office-server:
        - azure/functions
  brews:
    shared:
      # Bootstrap dependency: the age wrapper may need this before chezmoi can
      # decrypt source state.
      - age
      # Herdr's macOS reconciliation script uses associative arrays (Bash 4+).
      - bash
      - fish
      - mosh
      - mole
      - sing-box
      # Keep an OpenSSL 3 CLI/library instead of relying on Apple's LibreSSL.
      - openssl@3
      # Aqua has no macOS ARM64 packages for these CLIs; Homebrew uses
      # prebuilt bottles when available rather than compiling by default.
      - zstd
      - wget
      - steipete/tap/remindctl
    profiles:
      daily:
        - mas # Required for masApps installation
      home-server: []
      office-server: []
  casks:
    shared:
      - bitwarden
      - cmux
      # - visual-studio-code
      - keka
      - ghostty
      - orbstack
      # - electerm
      - chatgpt
      - zed
      # - omniwm
      # - otty
      # - stablyai/orca/orca
      # - abue-ammar/tinycast/tinycast
      - mactools
      - macshot
      # Nerd fonts and symbol fonts used by the terminal.
      - font-material-design-icons-webfont
      - font-fontawesome
      - font-hackgen-nerd
      - font-plemol-jp-nf
      - font-symbols-only-nerd-font
      - font-fira-code-nerd-font
      - font-caskaydia-cove-nerd-font
      - font-caskaydia-mono-nerd-font
      - font-jetbrains-mono-nerd-font
      - font-iosevka-nerd-font
      - font-iosevka-term-nerd-font
      - font-iosevka-term-slab-nerd-font
      - font-maple-mono
      - font-maple-mono-nf
      - font-maple-mono-nf-cn
    profiles:
      daily:
        - intellij-idea
        - cherry-studio
        - iina
        - telegram
        - wpsoffice-cn
        - android-platform-tools
      home-server: []
      office-server: []
  masApps:
    shared: []
    profiles:
      daily: []
      home-server: []
      office-server: []
