# Omarchy packages are managed by this dotfiles repository. Missing entries are
# installed, and entries removed from a previous manifest are uninstalled. Only
# packages previously recorded by this repository are eligible for cleanup; keep
# Omarchy base packages out of this list.
omarchyPackages:
  shared:
    # Fcitx5 Chinese input components managed by this dotfiles repository.
    - fcitx5-chinese-addons
    - fcitx5-configtool
    # Rime engine; librime-data provides the baseline Rime schemas.
    - fcitx5-rime
    # Fish shell only; keep Bash as the login shell. Omarchy-Fish defaults that
    # we actually want are copied into private_dot_config/private_fish instead
    # of installing omarchy-fish or running omarchy-setup-fish/chsh.
    - fish
    # Applications explicitly retained after `omarchy remove preinstalls`.
    - aether
    - obs-studio
    - libreoffice-fresh
    - lazydocker
    - omacalc
    - omacut
    - omawrite
    # dua-cli provides the `dua` command used by the Disk Usage TUI launcher.
    - dua-cli
    # Bitwarden plugin dependency; the plugin uses the official `bw` CLI.
    - bitwarden-cli
    # uniclipboard-bin 1.5.0 is built against GTK4/WebKitGTK 6.0, but its AUR
    # PKGBUILD still declares webkit2gtk-4.1/gtk3. Without this the GUI fails
    # with `libwebkitgtk-6.0.so.4: cannot open shared object file`.
    - webkitgtk-6.0
    # age and voxtype-bin are intentionally not managed by this list.
  profiles:
    hack:
      - nmap
      - masscan

# Terminal UI launchers explicitly retained after `omarchy remove preinstalls`.
# The reconciliation script owns only these named launchers.
omarchyTuis:
  shared:
    - name: Disk Usage
      command: dua i /
      window: float
      icon: disk-usage
    - name: Docker
      command: omarchy-launch-docker-tui
      window: tile
      icon: docker
  profiles: {}

# No Omarchy WebApps are retained after the official preinstall removal.
# run_after_17_omarchy-webapps enforces this empty allowlist after the marker
# is present.

# AI wrappers intentionally excluded from the post-preinstall allowlist.
# The cleanup script removes only mise-generated wrappers, never user-owned
# regular scripts or symlinks such as a vendor-installed Cursor launcher.
omarchyRemovedCli:
  shared:
    - command: claude
      package: claude
    - command: copilot
      package: copilot
    - command: gemini
      package: gemini
    - command: grok
      package: npm:@xai-official/grok
    - command: cursor-agent
      package: cursor-agent
    - command: omp
      package: github:can1357/oh-my-pi
  profiles: {}

# AUR packages managed by this dotfiles repository. These are kept separate
# from official packages because installation uses `omarchy pkg aur add`.
omarchyAurPackages:
  shared:
    # 雾凇拼音全拼及万象简体语法模型。
    - rime-ice-pinyin-git
    - rime-wanxiang-gram-zh-hans
    # hyprmoncfg's ready-made AUR binary; the plugin manages its user daemon.
    - hyprmoncfg-bin
    # Cross-device clipboard sync using the prebuilt desktop release.
    - uniclipboard-bin
    # Strata keyboard-first file manager; upstream CI publishes strata-bin to
    # the AUR on every release, so it tracks GitHub tags automatically.
    - strata-bin
    # MSIME (水杉输入法). The AUR package repacks the upstream Debian data.tar
    # and therefore never runs the Debian postinst/prerm: both registration and
    # unregistration must go through `msime-linux-setup` explicitly, which
    # run_onchange_after_12 does with --no-register because the Fcitx5 input
    # method list is owned by private_dot_config/fcitx5/private_profile.tmpl.
    - msime-bin
  profiles:
    hack:
      - whatweb

# Fcitx5 input methods on Omarchy. private_profile.tmpl and the selection step in
# run_onchange_after_12 read defaultIM from here, so the profile stays the single
# source of truth instead of drifting when an input method registers itself.
omarchyInputMethod:
  # rime | msime. Keep rime to evaluate MSIME side by side, then flip to msime.
  defaultIM: rime
  msime:
    # First run needs roughly 170 MB of dictionaries. Set to false on machines
    # that cannot reach the network during `chezmoi apply`.
    downloadDictionaries: true

# Third-party Omarchy shell plugins are an allowlist. Any plugin not listed
# here is removed by the reconciliation script on every chezmoi apply.
omarchyPlugins:
  pruneUnmanaged: true
  shared:
    - id: omaplug
      source: https://github.com/fross100/omaplug.git
      enabled: true
      section: right
    # Calendar and weather widget: a vendored copy of the upstream
    # manateelazycat/omarchy-days plugin, kept in this repository under
    # private_dot_config/omarchy/plugins/local.days (see its README for the
    # three local changes). `local: true` tells run_after_21 not to look for a
    # Git source and keeps the directory out of the unmanaged-plugin prune.
    # The bar label is the Chinese weekday plus time; clicking it opens the
    # panel with the lunar calendar, holidays and weather.
    - id: local.days
      local: true
      enabled: true
      section: center
    # Visual window and workspace switching: Orbit's Alt+Tab switcher plus a
    # vendored copy of Overview Workspaces that deliberately does not bind a
    # standalone Super press. run_after_24 keeps its Qt 6.12 qmldir fix applied.
    - id: io.github.manateelazycat.window-switcher
      source: https://github.com/manateelazycat/omarchy-window-switcher.git
      enabled: true
      section: left
    - id: crmne.hyprmoncfg
      source: https://github.com/crmne/omarchy-hyprmoncfg.git
      enabled: true
      section: right
    - id: io.github.elevate08.qs-bitwarden-cli
      source: https://github.com/Elevate08/qs-bitwarden-cli.git
      enabled: true
      section: right
    - id: harshith.system-monitor
      source: https://github.com/Harshith292002/omarchy-system-monitor.git
      enabled: true
      section: right
    # Lock screen explorer: replaces the built-in omarchy.lock service with 84
    # designs, a picker, and a designer. Service/overlay plugin; the optional
    # bar lock icon is added separately with `omarchy bar move lock-explorer`.
    - id: io.github.sirjul1337.lock-explorer
      source: https://github.com/SirJul1337/omarchy-lock-explorer.git
      enabled: true
  profiles: {}

# Community themes are installed and updated by Omarchy's own theme manager.
# The sync script preserves the selected theme and never prunes other themes.
omarchyThemes:
  shared:
    - id: catppuccin-latte
      source: https://github.com/ryanyogan/omarchy-catppuccin-latte-theme.git
    - id: catppuccin-frappe
      source: https://github.com/mikemayuare/omarchy-catppuccin-frappe.git
    # Keep .git so Omarchy retains its safe theme staging and update support.
    - id: macchiato-core
      source: https://github.com/hembramnishant50-glitch/omarchy-macchiato-core-theme.git
    - id: catppuccin-mocha
      source: https://github.com/KidDogDad/omarchy-catppuccin-mocha-theme.git
    - id: dracula
      source: https://github.com/catlee/omarchy-dracula-theme.git
  profiles: {}

# UFW rules managed by this dotfiles repository. Only entries recorded in the
# local manifest are eligible for cleanup when removed from this list.
omarchyUfwPorts:
  shared:
    # SOCKS proxy access from the trusted LAN.
    - name: lan-socks-2080
      port: "2080"
      protocol: tcp
      from: 192.168.50.0/24
    - name: lan-mihomo-ui-9090
      port: "9090"
      protocol: tcp
      from: any
    # Inbound service access on port 11010 from any source, over both transports.
    - name: incoming-11010-tcp
      port: "11010"
      protocol: tcp
      from: any
    - name: incoming-11010-udp
      port: "11010"
      protocol: udp
      from: any
  profiles: {}

# ─────────────────────────────────────────────────────────────────────────────
# Targets NOT managed on Omarchy (manual-migration mode).
#
# Semantics: on an Omarchy machine, chezmoi manages everything in this repo
# EXCEPT the entries below. ~/.config/mihoro.toml is deliberately absent, so
# it IS managed there. To adopt a file on Omarchy, delete its line here.
# ─────────────────────────────────────────────────────────────────────────────
omarchyIgnoreList:
  # macOS-only software
  - .Brewfile
  - .config/aerospace
  - .config/raycast
  - .config/surge
  # dsh（DeepSeek Harness）只在 macOS 由 mise 的 npm backend 安装，
  # 该 wrapper 在 Omarchy 上没有对应的工具，因此不纳管。
  - .local/bin/dsh
  # mise 配置在 Omarchy 纳管（共享运行时工具声明）；
  # 安装脚本使用 Omarchy 提供的系统 mise，不改写 mise 二进制来源。
  # Pi 本体由 mise 的 npm backend 管理，公共入口使用 mise 的 Node；~/.pi + web-search
  # 生效，auth.json 和 sessions 仍不归仓库管（前者需 pi 登录，后者按机器独立）。
  # ~/.ssh/config is encrypted with ~/.ssh/main and managed by this repo.
  - .config/atuin
  - .config/bat
  - .config/delta
  - .config/direnv
  - .config/fzf
  - .config/gh
  - .config/gh-dash
  - .config/ghostty
  - .config/git
  - .config/lazygit
  - .config/nvim
  - .config/omnyssh
  - .config/opencode
  - .config/yazi
  - .config/zellij
