name: Update pinned versions
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    name: Update versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Get latest versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          curl_sha256() {
            local url="$1"
            curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors -L "$url" \
              | sha256sum | awk '{print $1}'
          }

          aqua_installer=$(gh release view --repo aquaproj/aqua-installer --json tagName -q '.tagName')
          aqua_installer_sha256=$(curl_sha256 "https://raw.githubusercontent.com/aquaproj/aqua-installer/${aqua_installer}/aqua-installer")
          aqua_version=$(gh release view --repo aquaproj/aqua --json tagName -q '.tagName')
          # mihomo fork asset names carry a build suffix (currently -ebpf);
          # take the build sha from any asset name rather than a fixed tail.
          # paperlib tag format: release-electron-X.Y.Z -> extract X.Y.Z
          paperlib=$(gh release view --repo Future-Scholars/paperlib --json tagName -q '.tagName' | sed 's/release-electron-//')
          # google-cloud-sdk mirror repo publishes tags (not GitHub Releases)
          gcloud_version=$(gh api repos/twistedpair/google-cloud-sdk/tags --jq '.[0].name')
          mihomo_fork_build=$(gh api repos/liuran001/mihomo/releases/tags/Prerelease-Alpha --jq '.assets[].name' | grep -oE 'alpha-smart-[0-9a-f]+' | head -1 | sed -E 's/.*smart-([0-9a-f]+).*/\1/')
          zashboard_version=$(gh release view --repo Zephyruso/zashboard --json tagName -q '.tagName')

          latest_stable_release_ref() {
            local repo="$1"
            local ref

            if [[ "$repo" == volcengine/OpenViking ]]; then
              # Scoped package releases share this repo; filter for app tags.
              ref="$(gh api --paginate "repos/$repo/releases?per_page=100" \
                | jq -sr '[.[][]
                  | select(.draft == false and .prerelease == false)
                  | select(.tag_name | test("^v[0-9]+(\\.[0-9]+){2,3}$"))]
                  | max_by(.published_at) | .tag_name // empty')"
            else
              ref="$(gh release list \
                --repo "$repo" \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 1 \
                --json tagName \
                --jq '.[0].tagName // empty')"
            fi
            if [[ -z "$ref" ]]; then
              echo "No stable GitHub release found for $repo" >&2
              return 1
            fi
            if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Unexpected non-semver release tag for $repo: $ref" >&2
              return 1
            fi
            printf '%s\n' "$ref"
          }

          openviking_version="$(latest_stable_release_ref volcengine/OpenViking)"
          openviking_rev="$(gh api "repos/volcengine/OpenViking/commits/${openviking_version}" -q '.sha')"
          graphify_tag="$(latest_stable_release_ref Graphify-Labs/graphify)"
          graphify_version="${graphify_tag#v}"

          herdr_agent_usage_ref="$(latest_stable_release_ref senna-lang/herdr-agent-usage)"
          herdr_navigator_ref="$(latest_stable_release_ref thanhdat77/herdr-navigator)"

          # EasyTier publishes per-OS/arch archives; the macOS arm64 digest is
          # pinned for the office-server Mac (the only EasyTier node).
          easytier_version="$(latest_stable_release_ref EasyTier/EasyTier)"
          easytier_macos_sha256=$(curl_sha256 "https://github.com/EasyTier/EasyTier/releases/download/${easytier_version}/easytier-macos-aarch64-${easytier_version}.zip")

          {
            echo "aqua_installer=$aqua_installer"
            echo "aqua_installer_sha256=$aqua_installer_sha256"
            echo "aqua_version=$aqua_version"
            echo "paperlib=$paperlib"
            echo "gcloud_version=$gcloud_version"
            echo "mihomo_fork_build=$mihomo_fork_build"
            echo "zashboard_version=$zashboard_version"
            echo "openviking_version=$openviking_version"
            echo "openviking_rev=$openviking_rev"
            echo "graphify_version=$graphify_version"
            echo "easytier_version=$easytier_version"
            echo "easytier_macos_sha256=$easytier_macos_sha256"
            echo "herdr_agent_usage_ref=$herdr_agent_usage_ref"
            echo "herdr_navigator_ref=$herdr_navigator_ref"
          } >> "$GITHUB_OUTPUT"
      - name: Update .chezmoidata/versions.yaml
        run: |
          sed -i 's/aquaInstaller: .*/aquaInstaller: ${{ steps.versions.outputs.aqua_installer }}/' .chezmoidata/versions.yaml
          sed -i 's/aquaInstallerSha256: .*/aquaInstallerSha256: ${{ steps.versions.outputs.aqua_installer_sha256 }}/' .chezmoidata/versions.yaml
          sed -i 's/aquaVersion: .*/aquaVersion: ${{ steps.versions.outputs.aqua_version }}/' .chezmoidata/versions.yaml
          sed -i 's/paperlib: .*/paperlib: ${{ steps.versions.outputs.paperlib }}/' .chezmoidata/versions.yaml
          sed -i 's/gcloudVersion: .*/gcloudVersion: ${{ steps.versions.outputs.gcloud_version }}/' .chezmoidata/versions.yaml
          sed -i 's/mihomoForkBuild: .*/mihomoForkBuild: ${{ steps.versions.outputs.mihomo_fork_build }}/' .chezmoidata/versions.yaml
          sed -i 's/zashboardVersion: .*/zashboardVersion: ${{ steps.versions.outputs.zashboard_version }}/' .chezmoidata/versions.yaml
          sed -i 's/openvikingExtensionVersion: .*/openvikingExtensionVersion: ${{ steps.versions.outputs.openviking_version }}/' .chezmoidata/versions.yaml
          sed -i 's/openvikingExtensionRev: .*/openvikingExtensionRev: ${{ steps.versions.outputs.openviking_rev }}/' .chezmoidata/versions.yaml
          sed -i 's/graphifyVersion: .*/graphifyVersion: ${{ steps.versions.outputs.graphify_version }}/' .chezmoidata/versions.yaml
          sed -i 's/easytierVersion: .*/easytierVersion: ${{ steps.versions.outputs.easytier_version }}/' .chezmoidata/versions.yaml
          sed -i 's/easytierMacosAarch64Sha256: .*/easytierMacosAarch64Sha256: ${{ steps.versions.outputs.easytier_macos_sha256 }}/' .chezmoidata/versions.yaml
      - name: Update Herdr plugin refs
        env:
          HERDR_AGENT_USAGE_REF: ${{ steps.versions.outputs.herdr_agent_usage_ref }}
          HERDR_NAVIGATOR_REF: ${{ steps.versions.outputs.herdr_navigator_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path(".chezmoidata/herdr.yaml")
          lines = manifest.read_text(encoding="utf-8").splitlines(keepends=True)
          updates = {
              "senna-lang/herdr-agent-usage": os.environ["HERDR_AGENT_USAGE_REF"],
              "thanhdat77/herdr-navigator": os.environ["HERDR_NAVIGATOR_REF"],
          }

          for source, ref in updates.items():
              matches = [
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == f"- source: {source}"
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one Herdr plugin entry for {source}, found {len(matches)}"
                  )

              ref_index = matches[0] + 1
              if ref_index >= len(lines):
                  raise SystemExit(f"Missing ref after Herdr plugin entry: {source}")
              ref_line = lines[ref_index]
              if not ref_line.lstrip().startswith("ref:"):
                  raise SystemExit(f"Missing ref after Herdr plugin entry: {source}")

              indent = ref_line[: len(ref_line) - len(ref_line.lstrip())]
              if ref_line.endswith("\r\n"):
                  newline = "\r\n"
              elif ref_line.endswith("\n"):
                  newline = "\n"
              else:
                  newline = ""
              old_ref = ref_line.strip()
              lines[ref_index] = f"{indent}ref: {ref}{newline}"
              print(f"{source}: {old_ref} -> ref: {ref}")

          manifest.write_text("".join(lines), encoding="utf-8")
          PY
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- .chezmoidata/versions.yaml .chezmoidata/herdr.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get current date
        if: steps.changes.outputs.changed == 'true'
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          add-paths: |
            .chezmoidata/versions.yaml
            .chezmoidata/herdr.yaml
          commit-message: "chore(versions): update pinned versions"
          title: "chore(versions): update pinned versions (${{ steps.date.outputs.date }})"
          branch: update-pinned-versions
          labels: dependencies,automation
          body: |
            Automated version update for pinned dependencies.

            | Package | Version |
            |---------|---------|
            | aqua-installer | `${{ steps.versions.outputs.aqua_installer }}` |
            | aqua-installer sha256 | `${{ steps.versions.outputs.aqua_installer_sha256 }}` |
            | aqua | `${{ steps.versions.outputs.aqua_version }}` |
             | paperlib | `${{ steps.versions.outputs.paperlib }}` |
             | google-cloud-sdk | `${{ steps.versions.outputs.gcloud_version }}` |
            | mihomo fork build | `${{ steps.versions.outputs.mihomo_fork_build }}` |
            | zashboard | `${{ steps.versions.outputs.zashboard_version }}` |
            | OpenViking extension | `${{ steps.versions.outputs.openviking_version }}` |
            | OpenViking extension commit | `${{ steps.versions.outputs.openviking_rev }}` |
            | Graphify CLI / guard | `${{ steps.versions.outputs.graphify_version }}` |
            | EasyTier | `${{ steps.versions.outputs.easytier_version }}` |
            | EasyTier macos-aarch64 sha256 | `${{ steps.versions.outputs.easytier_macos_sha256 }}` |
            | senna-lang/herdr-agent-usage | `${{ steps.versions.outputs.herdr_agent_usage_ref }}` |
            | thanhdat77/herdr-navigator | `${{ steps.versions.outputs.herdr_navigator_ref }}` |

      - name: Enable pull request auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Keep this branch current so the next day's aqua.yaml update PR
          # does not conflict with stale versions.yaml pins.
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --auto --squash
