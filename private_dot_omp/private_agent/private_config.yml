symbolPreset: nerd
# Hindsight memory (shared runtime with pi; bank resolved from cwd, same
# coding-agent::{gitProject} banks). Config lives in ~/.hindsight/coding-agent.json.
extensions:
  - ~/.hindsight/coding-agents/dist/pi.js
composer:
  shape: band
theme:
  dark: titanium
  light: light
setupVersion: 2
modelRoles:
  smol: home-magpie/group/daily
# Magic Context owns the context plane (its plugin sets these; kept explicit
# so a bare `omp config set` cannot silently flip them back).
compaction:
  enabled: false
memory:
  backend: "off"