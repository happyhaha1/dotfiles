# 雾凇拼音全拼 + 万象简体语法模型。
# Tap either Shift key to switch Chinese/English with Rime's native handler.
# CapsLock keeps its normal capitalization behavior; no Lua hook is needed.
patch:
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -20
  translator/contextual_suggestions: false
  translator/max_homophones: 8
  # 雾凇拼音的第 3 个开关是 traditionalization: [简, 繁]. Reset to
  # simplified Chinese so an accidental Ctrl+Shift+4 does not survive redeploy.
  switches/@2/reset: 0
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key/Caps_Lock: noop
  # Keep the current candidate when switching during composition.
  ascii_composer/switch_key/Shift_L: commit_text
  ascii_composer/switch_key/Shift_R: commit_text
