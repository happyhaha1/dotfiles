# 雾凇拼音全拼 + 万象简体语法模型。
# Keep CapsLock as the language toggle; Shift and Menu have no built-in
# ascii-mode action because Hyprland maps physical CapsLock to Menu.
patch:
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -20
  translator/contextual_suggestions: false
  translator/max_homophones: 8
  ascii_composer/switch_key/Shift_L: noop
  ascii_composer/switch_key/Shift_R: noop
  ascii_composer/switch_key/Menu: noop
  "engine/processors/@before 0": lua_processor@*capslock_toggle
