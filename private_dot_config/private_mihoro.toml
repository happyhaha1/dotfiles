# ─────────────────────────────────────────────────────────────────────────────
# mihoro 配置（demo）—— mihomo (Clash Meta) CLI 管理器
#
# ★ 你要做的唯一必改项：把下面 remote_config_url 换成你的真实订阅地址。
#
# ★★ 填好真实 URL 之后、git commit 之前，必须执行一次：
#      chezmoi add --encrypt ~/.config/mihoro.toml
#    它会把本源文件转换成 age 加密的 .age 文件 —— 订阅 URL 等同密码，
#    绝不能以明文进 git。
#
# 改完配置后让 mihomo 生效：
#      mihoro apply        # 应用 override 并重启服务
#      mihoro update       # 重新拉订阅
#
# 首次使用：填好 URL 后直接 `mihoro init`（检测到 URL 已填，零交互全自动）。
# 完整字段参考：https://github.com/spencerwooo/mihoro#readme
# ─────────────────────────────────────────────────────────────────────────────

# ★★★ 必改：你的机场订阅地址 ★★★
remote_config_url = "https://请替换成你的订阅地址"

# 面板：metacubexd（默认）/ zashboard / yacd-meta / custom:下载地址
ui = "metacubexd"

# mihomo 内核渠道：stable / alpha
mihomo_channel = "stable"

# 以下三项一般不用动：mihoro 自己管理内核与运行目录
mihomo_binary_path = "~/.local/bin/mihomo"
mihomo_config_root = "~/.config/mihomo"
user_systemd_root = "~/.config/systemd/user"
mihoro_user_agent = "mihoro"

# 订阅自动更新间隔（小时，1-24，0 = 关闭；启用：mihoro cron enable）
auto_update_interval = 12

[mihomo_config]
# HTTP / SOCKS / 混合代理端口
port = 7891
socks_port = 7892
mixed_port = 7890

# 局域网共享代理开关（打开后同一 WiFi 下设备可用你的代理）
allow_lan = false
bind_address = "*"

# rule = 规则分流 / global = 全局 / direct = 直连
mode = "rule"
log_level = "info"
ipv6 = true

# 控制 API（面板后端）。0.0.0.0 = 局域网可访问面板；
# 若只有本机用面板，改成 "127.0.0.1:9090" 更安全
external_controller = "0.0.0.0:9090"
external_ui = "ui"

geodata_mode = false
geo_auto_update = true
geo_update_interval = 24

[mihomo_config.geox_url]
geoip = "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
geosite = "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
mmdb = "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
