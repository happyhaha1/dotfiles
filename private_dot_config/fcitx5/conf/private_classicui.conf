# Fcitx5 Classic UI appearance.
# Use the vendored Mellow Sakura dark theme for Fcitx5 Classic UI.
# The theme assets live under ~/.local/share/fcitx5/themes/mellow-sakura-dark.
Theme=mellow-sakura-dark
DarkTheme=mellow-sakura-dark
UseDarkTheme=False
# Font sizes are points and are multiplied by the 1.6x Wayland monitor scale.
# 10 keeps the candidate panel close to the 9pt Alacritty text size.
Font="Noto Sans CJK SC 10"
MenuFont="Noto Sans CJK SC 10"
Vertical Candidate List=False
UseAccentColor=False
