# Fcitx5 Classic UI appearance.
# Use the vendored Catppuccin Mocha theme with the Dracula purple accent
# (#bd93f9, Dracula's signature color) for Fcitx5 Classic UI.
# The theme assets live under ~/.local/share/fcitx5/themes/catppuccin-mocha-dracula.
Theme=catppuccin-mocha-dracula
DarkTheme=catppuccin-mocha-dracula
UseDarkTheme=False
# Font sizes are points and are multiplied by the 1.6x Wayland monitor scale.
# 10 keeps the candidate panel close to the 9pt Alacritty text size.
Font="Noto Sans CJK SC 10"
MenuFont="Noto Sans CJK SC 10"
Vertical Candidate List=False
UseAccentColor=False
