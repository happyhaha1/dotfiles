---
packages:
  - name: crates.io/eza
    type: cargo
    crate: eza
    files:
      - name: eza
    cargo:
      locked: true

  - type: github_release
    repo_owner: timhartmann7
    repo_name: omnyssh
    asset: omny-{{.Arch}}-{{.OS}}.tar.gz
    format: tar.gz
    files:
      - name: omny
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
