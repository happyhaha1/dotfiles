# Dracula for Omarchy, with Dracula's purple (#bd93f9) as the accent.
#
# The palette is Dracula's (https://draculatheme.com); the shape of this file
# follows https://github.com/catlee/omarchy-dracula-theme, whose accent is
# Dracula's cyan. This theme keeps every Dracula color and moves the accent to
# the signature purple so it matches Pi's Dracula theme (see pi.json) and the
# vendored Fcitx5 theme.
mode = "dark"

accent = "#bd93f9"
selection = "#44475a"
muted = "#6272a4"

# Explicit accent alias: Omarchy resolves color names inside gradients (for
# example hyprland_active_border) against the palette keys, and without this
# key "purple" would fall back to magenta.
purple = "#bd93f9"

background = "#282a36"
dark_background = "#21222c"
darker_background = "#191a24"
lighter_background = "#343746"

foreground = "#f8f8f2"
dark_foreground = "#6272a4"
light_foreground = "#f8f8f2"
bright_foreground = "#ffffff"

red = "#ff5555"
yellow = "#f1fa8c"
orange = "#ffb86c"
green = "#50fa7b"
cyan = "#8be9fd"
blue = "#bd93f9"
magenta = "#ff79c6"
brown = "#a88984"

bright_red = "#ff6e6e"
bright_yellow = "#ffffa5"
bright_green = "#69ff94"
bright_cyan = "#a4ffff"
bright_blue = "#d6acff"
bright_magenta = "#ff92df"

# Solid Dracula purple, so every accent surface the theme draws from this key
# (Hyprland active-window border, plus the shell's notification, launcher, menu,
# polkit and lock borders) is the purple itself rather than a two-tone gradient.
# For a purple-only gradient instead, use: "purple bright_blue 45deg".
hyprland_active_border = "purple"
hyprland_inactive_border = "rgba(68,71,90,0.8)"
